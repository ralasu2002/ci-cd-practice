name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: "Deploy to staging (simulated)"
        run: echo "Deploying calculator.py to STAGING environment..."

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: "Deploy to production (simulated)"
        run: echo "Deploying calculator.py to PRODUCTION environment..."
